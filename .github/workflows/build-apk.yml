name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          mkdir -p app/src/main/java/com/example/pdftoolkit
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          for f in MainActivity.kt PdfOps.kt Tool.kt Ui.kt Convert.kt; do
            if [ -f "$f" ]; then
              mv "$f" "app/src/main/java/com/example/pdftoolkit/$f"
            fi
          done

          if [ -f "AndroidManifest.xml" ]; then
            mv "AndroidManifest.xml" "app/src/main/AndroidManifest.xml"
          fi

          if [ -f "build.gradle.kts" ] && [ ! -f "app/build.gradle.kts" ]; then
            mv "build.gradle.kts" "app/build.gradle.kts"
          fi

          # Set App Name to PDFix
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">PDFix</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.PdfToolkit" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          # Create Custom Vector App Icon for PDFix
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_pdfix.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#D32F2F"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#B71C1C"
                  android:pathData="M54,0h54v108h-54z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M30,22 L64,22 L78,36 L78,86 L30,86 Z"/>
              <path
                  android:fillColor="#FFCDD2"
                  android:pathData="M64,22 L64,36 L78,36 Z"/>
              <path
                  android:fillColor="#D32F2F"
                  android:pathData="M38,48 L70,48 L70,53 L38,53 Z M38,58 L70,58 L70,63 L38,63 Z M38,68 L58,68 L58,73 L38,73 Z"/>
          </vector>
          EOF

          # Ensure AndroidManifest uses internet permission and custom icon
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            if ! grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
              sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <application/' app/src/main/AndroidManifest.xml
            fi
            sed -i 's/android:icon="[^"]*"/android:icon="@drawable\/ic_launcher_pdfix"/g' app/src/main/AndroidManifest.xml
            if ! grep -q "android:icon=" app/src/main/AndroidManifest.xml; then
              sed -i 's/<application/<application android:icon="@drawable\/ic_launcher_pdfix"/' app/src/main/AndroidManifest.xml
            fi
            sed -i 's/android:label="[^"]*"/android:label="@string\/app_name"/g' app/src/main/AndroidManifest.xml
          fi

          if [ ! -f "settings.gradle.kts" ]; then
            cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PDFix"
          include(":app")
          EOF
          fi

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          if [ ! -f "gradle.properties" ]; then
            cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          fi

          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.2
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== DETAILED ERRORS ==="
            grep -nE "(^e:|error:|Unresolved|Type mismatch|Cannot access|What went wrong:)" build.log | tail -n 50
          fi
          exit $EXIT_CODE
      - uses: actions/upload-artifact@v4
        with:
          name: PDFix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
