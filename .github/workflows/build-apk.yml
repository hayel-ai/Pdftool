name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          mkdir -p app/src/main/java/com/example/pdftoolkit
          mkdir -p app/src/main/res/values

          for f in MainActivity.kt PdfOps.kt Tool.kt Ui.kt Convert.kt; do
            if [ -f "$f" ]; then
              mv "$f" "app/src/main/java/com/example/pdftoolkit/$f"
            fi
          done

          if [ -f "AndroidManifest.xml" ]; then
            mv "AndroidManifest.xml" "app/src/main/AndroidManifest.xml"
          fi

          if [ -f "build.gradle.kts" ] && [ ! -f "app/build.gradle.kts" ]; then
            mv "build.gradle.kts" "app/build.gradle.kts"
          fi

          if [ ! -f "app/src/main/res/values/strings.xml" ]; then
            cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">PdfToolkit</string>
          </resources>
          EOF
          fi

          if [ ! -f "app/src/main/res/values/themes.xml" ]; then
            cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.PdfToolkit" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF
          fi

          if [ ! -f "settings.gradle.kts" ]; then
            cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PdfToolkit"
          include(":app")
          EOF
          fi

          if [ ! -f "build.gradle.kts" ]; then
            cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF
          fi

          if [ ! -f "gradle.properties" ]; then
            cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          fi

          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.2
          fi

          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
